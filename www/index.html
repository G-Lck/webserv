<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webserv</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #243447;
      background: #f4f7fb;
    }
    main {
      max-width: 560px;
      margin: 24px;
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(36, 52, 71, 0.12);
    }
    h1 { margin-top: 0; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      color: white;
      text-decoration: none;
      background: #2878b5;
      border-radius: 6px;
    }
    a:hover { background: #1e5d8d; }
  </style>
</head>
<body>
  <main>
    <h1>Webserv</h1>
    <p>The server is running.</p>
    <a href="/geneva_birds/">Open the Birds of Geneva site</a>
  </main>
</body>
</html>
