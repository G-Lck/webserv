root /var/www/html;
index index.html;
autoindex off;
client_max_body_size 10000;

server {
    listen 8085;
    server_name localhost;
    root /var/www/html;
    index index.html index.htm;
    error_page 404 /404.html;
    error_page 500 /50x.html;
    autoindex off;
    client_max_body_size 5000;
    cgi_handler .php /usr/bin/php;

    location / {
        limit_except GET POST;
        autoindex off;
        index index.html;
    }

    location /upload {
        limit_except POST;
        autoindex off;
    }
}
