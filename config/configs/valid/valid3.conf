root /var/www;
index index.html;
autoindex off;
client_max_body_size 100000;
error_page 404 /errors/404.html;
error_page 500 /errors/500.html;

server {
    listen 8080;
    listen 127.0.0.1:8081;
    server_name localhost _;
    root /var/www/main;
    index index.html index.htm;
    autoindex on;
    client_max_body_size 50000;
    cgi_handler .py /usr/bin/python3;

    location / {
        limit_except GET POST;
        index index.html;
        autoindex on;
    }

    location /static {
        limit_except GET;
        root /var/www/static;
        autoindex off;
    }

    location /upload {
        limit_except POST;
        client_max_body_size 100000;
    }

    location /redirect {
        return 301 /;
    }

    location /cgi-bin {
        limit_except GET POST;
        cgi_handler .py /usr/bin/python3;
        root /var/www/cgi;
    }
}
