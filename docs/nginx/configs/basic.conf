worker_processes 1;

error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log logs/access.log;

    server {
        listen 127.0.0.1:8088;
        server_name localhost;

        location / {
            root ../../www;
            index index.html;
        }

        location /missing {
            return 404;
        }

        location /boom {
            return 500 "Internal error test\n";
        }

        location /echo {
            return 200 "echo endpoint\n";
        }
    }
}
